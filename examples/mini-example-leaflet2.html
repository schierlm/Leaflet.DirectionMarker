<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minimal example</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css" integrity="sha256-RwBOaSN3kFqUIUAZaMmmo5grrEMRXwBCe0sCRJgqydk=" crossorigin=""/>
<script type="importmap">
  {
    "imports": {
        "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js",
        "leaflet-directionmarker": "../src/leaflet2.directionmarker.js"
    },
    "integrity": {
        "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js": "sha256-KSSQ64wnHC2i4zVNU79jUjWmdKCIJjLj/gkifFEluvo="
    }
  }
</script>
<style type="text/css">
body, #map { height: 100vh;  width: 100vw; margin: 0;}

/* needed if you want to use the direction pane */
.leaflet-direction-pane { z-index: 620; pointer-events: none; }

</style>
<script type="module">

import {LeafletMap, TileLayer, Marker} from 'leaflet';
import {DirectionMarker} from 'leaflet-directionmarker';

window.onload = function() {
	DirectionMarker.initialize('../src/');
	let map = new LeafletMap('map').setView([52.5167,13.3833], 6);
	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	new Marker([52.5167,13.3833], {alt: "Berlin"}).addTo(map);
	new DirectionMarker([52.5167,13.3833], {alt: "Berlin"}).addTo(map);
};

</script>
</head>
<body><div id="map"></div></body>
</html>
